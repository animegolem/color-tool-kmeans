name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (tauri-app)
        run: |
          cd tauri-app
          npm ci --no-audit --no-fund

      - name: Enforce Svelte runes event syntax
        run: |
          if rg --files-with-matches --glob "*.svelte" "on:[a-zA-Z]" tauri-app/src >/dev/null; then
            echo "Use onclick/oninput style events (Svelte 5 runes) instead of on: syntax" >&2
            exit 1
          fi

      - name: Install FFmpeg sidecars (Linux)
        run: |
          cd tauri-app
          ./scripts/fetch-ffmpeg-btbn-lgpl.sh x86_64-unknown-linux-gnu https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz

      - name: Install Linux system deps (glib/gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev webkit2gtk-4.1 libayatana-appindicator3-dev librsvg2-dev

      - name: Run frontend format, lint, and type checks
        run: |
          cd tauri-app
          npm run format:check
          npm run lint
          npm run check

      - name: Run full frontend test suite
        run: |
          cd tauri-app
          npm run test -- --run

      - name: Run TS gamut boundary test
        run: |
          cd tauri-app
          npm test -- src/lib/exports/__tests__/gamut-boundary.spec.ts

      - name: Run k-means snapshot test (scalar path, no simd)
        run: cargo test -p color-core --no-default-features --test kmeans_snapshots

      - name: Verify color-core stays tauri-free
        run: |
          if cargo tree -p color-core --edges normal | grep -i tauri; then
            echo "color-core must not depend on tauri" >&2
            exit 1
          fi

      - name: Run full Rust workspace test suite
        run: cargo test --workspace

      - name: Electron app tests
        if: ${{ hashFiles('electron-app/package.json') != '' }}
        run: |
          cd electron-app
          npm test

      - name: Rust fmt/clippy
        if: ${{ hashFiles('src-tauri/Cargo.toml') != '' || hashFiles('tauri-app/src-tauri/Cargo.toml') != '' }}
        run: |
          sudo apt-get update && sudo apt-get install -y libgtk-3-dev webkit2gtk-4.1 libayatana-appindicator3-dev librsvg2-dev || true
          rustup update stable
          (cd tauri-app/src-tauri 2>/dev/null || cd src-tauri 2>/dev/null; cargo fmt --all -- --check && cargo clippy --workspace -- -D warnings)

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install FFmpeg sidecars (Windows)
        shell: bash
        run: |
          cd tauri-app
          ./scripts/fetch-ffmpeg-btbn-lgpl.sh x86_64-pc-windows-msvc https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip

      - name: Install dependencies
        run: |
          cd tauri-app
          npm ci --no-audit --no-fund

      - name: Build Tauri app (Windows)
        run: |
          cd tauri-app
          npm run tauri build

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-bundle
          path: target/release/bundle
